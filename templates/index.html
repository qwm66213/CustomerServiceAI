<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 智能客服</title>
  <style>
    :root {
      --bg-page: #f0f2f5; --bg-chat: #fff; --bg-header: #1677ff;
      --bg-user: #1677ff; --bg-bot: #f5f5f5; --bg-quick: #e6f4ff;
      --text-primary: #333; --text-user: #fff; --text-bot: #333;
      --text-header: #fff; --text-quick: #1677ff; --text-source: #999;
      --text-placeholder: #aaa; --border-quick: #91caff;
      --border-input: #ddd; --border-top: #eee;
      --shadow: rgba(0,0,0,.12); --input-focus: #1677ff;
      --btn-hover: #0958d9; --btn-disabled: #b0c7ff;
      --typing-dot: #999; --quick-hover: #bae0ff;
    }
    body.dark {
      --bg-page: #1a1a2e; --bg-chat: #16213e; --bg-header: #0f3460;
      --bg-user: #0f3460; --bg-bot: #1a1a2e; --bg-quick: #1a1a2e;
      --text-primary: #e0e0e0; --text-user: #e0e0e0; --text-bot: #e0e0e0;
      --text-header: #e0e0e0; --text-quick: #64b5f6; --text-source: #888;
      --text-placeholder: #666; --border-quick: #2a4a7f;
      --border-input: #2a2a4a; --border-top: #2a2a4a;
      --shadow: rgba(0,0,0,.4); --input-focus: #64b5f6;
      --btn-hover: #1565c0; --btn-disabled: #2a4a7f;
      --typing-dot: #888; --quick-hover: #2a4a7f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-page); height: 100vh; display: flex; justify-content: center; align-items: center; }

    .chat-container { width: 100%; max-width: 420px; height: 100vh; max-height: 640px; background: var(--bg-chat); border-radius: 12px; box-shadow: 0 4px 24px var(--shadow); display: flex; flex-direction: column; overflow: hidden; }

    .chat-header { background: var(--bg-header); color: var(--text-header); padding: 16px 20px; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .theme-toggle { background: none; border: 1px solid rgba(255,255,255,.3); color: var(--text-header); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--bg-user); color: var(--text-user); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bg-bot); color: var(--text-bot); border-bottom-left-radius: 4px; }
    .msg .source-tag { font-size: 11px; color: var(--text-source); margin-top: 4px; }

    .feedback-row { display: flex; gap: 8px; margin-top: 6px; }
    .fb-btn { border: 1px solid var(--border-quick); background: var(--bg-quick); color: var(--text-quick); border-radius: 12px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
    .fb-btn:hover { opacity: .8; }
    .fb-done { font-size: 12px; color: var(--text-source); }

    .chat-input { display: flex; padding: 12px 16px; border-top: 1px solid var(--border-top); gap: 8px; }
    .chat-input input { flex: 1; border: 1px solid var(--border-input); border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; background: var(--bg-chat); color: var(--text-primary); transition: border .2s; }
    .chat-input input::placeholder { color: var(--text-placeholder); }
    .chat-input input:focus { border-color: var(--input-focus); }
    .chat-input button { background: var(--bg-header); color: var(--text-header); border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; transition: background .2s; }
    .chat-input button:hover { background: var(--btn-hover); }
    .chat-input button:disabled { background: var(--btn-disabled); cursor: not-allowed; }

    .typing { display: inline-block; width: 6px; height: 6px; background: var(--typing-dot); border-radius: 50%; animation: blink 1s infinite; }
    .typing:nth-child(2) { animation-delay: .2s; }
    .typing:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

    .quick-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
    .quick-btn { background: var(--bg-quick); color: var(--text-quick); border: 1px solid var(--border-quick); border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: background .2s; }
    .quick-btn:hover { background: var(--quick-hover); }

    @media (max-width: 480px) {
      .chat-container { max-width: 100%; max-height: 100vh; border-radius: 0; box-shadow: none; }
      .chat-input input { font-size: 16px; }
      .quick-btn { min-height: 36px; padding: 6px 14px; }
      .chat-input button { min-height: 44px; }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <span>AI 智能客服</span>
      <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
    </div>
    <div class="chat-messages" id="messages">
      <div class="msg bot">您好！我是AI智能客服，有什么可以帮您？</div>
    </div>
    <div class="quick-actions" id="quickActions"></div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="请输入您的问题…" autocomplete="off">
      <button id="sendBtn">发送</button>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
