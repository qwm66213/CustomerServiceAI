<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能客服</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }

    .chat-container { width: 420px; height: 640px; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.12); display: flex; flex-direction: column; overflow: hidden; }

    .chat-header { background: #1677ff; color: #fff; padding: 16px 20px; font-size: 16px; font-weight: 600; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #1677ff; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #f5f5f5; color: #333; border-bottom-left-radius: 4px; }
    .msg .source-tag { font-size: 11px; color: #999; margin-top: 4px; }

    .chat-input { display: flex; padding: 12px 16px; border-top: 1px solid #eee; gap: 8px; }
    .chat-input input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; transition: border .2s; }
    .chat-input input:focus { border-color: #1677ff; }
    .chat-input button { background: #1677ff; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; transition: background .2s; }
    .chat-input button:hover { background: #0958d9; }
    .chat-input button:disabled { background: #b0c7ff; cursor: not-allowed; }

    .typing { display: inline-block; width: 6px; height: 6px; background: #999; border-radius: 50%; animation: blink 1s infinite; }
    .typing:nth-child(2) { animation-delay: .2s; }
    .typing:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

    .quick-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
    .quick-btn { background: #e6f4ff; color: #1677ff; border: 1px solid #91caff; border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: background .2s; }
    .quick-btn:hover { background: #bae0ff; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">AI 智能客服</div>
    <div class="chat-messages" id="messages">
      <div class="msg bot">您好！我是AI智能客服，有什么可以帮您？</div>
    </div>
    <div class="quick-actions" id="quickActions">
      <button class="quick-btn" data-q="退款多久到账">退款多久到账</button>
      <button class="quick-btn" data-q="多久发货">多久发货</button>
      <button class="quick-btn" data-q="如何查询物流">查询物流</button>
      <button class="quick-btn" data-q="运费怎么算">运费说明</button>
      <button class="quick-btn" data-q="如何联系人工客服">转人工</button>
    </div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="请输入您的问题…" autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
